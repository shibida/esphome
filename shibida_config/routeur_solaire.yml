substitutions:
  friendly_name: Routeur Solaire
esphome:
  name: routeur-solaire
  friendly_name: ${friendly_name}
  platformio_options:
    upload_speed: 115200
  on_boot:
    priority: 800
    # Force mode auto et temperature ok au demarrage
    then:
      - switch.turn_on: modeauto
      - binary_sensor.template.publish:
          id: temperatureok
          state: ON

esp32:
  board: "wt32-eth01"
  framework:
    type: arduino

# Enable logging
logger:
  level: INFO

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Paris
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org

ethernet:
  use_address: 192.168.1.9
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  power_pin: GPIO16
  phy_addr: 1

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80

globals:
  - id: striac
    type: float
    restore_value: yes
    initial_value: "0"

binary_sensor:
  # Etat de la connection
  - platform: status
    name: "Status"

  # Temperature triac OK
  - platform: template
    name: "Temp Ok"
    id: temperatureok

# Input Number
number:
  # Seuil Max sortie triac
  - platform: template
    name: "P Max"
    id: pmax
    optimistic: true
    restore_value: true
    mode: box
    min_value: 0
    max_value: 100
    initial_value: 100
    unit_of_measurement: "%"
    step: 1

  # Seuil MAX temperature
  - platform: template
    name: "T Max"
    id: tmax
    optimistic: true
    restore_value: true
    mode: box
    min_value: -20
    max_value: 110
    initial_value: 80
    unit_of_measurement: "C°"
    step: 0.1

  # Objectif routeur
  - platform: template
    name: "Objectif"
    id: objective
    optimistic: true
    restore_value: true
    mode: box
    min_value: -100
    max_value: 10000
    unit_of_measurement: "W"
    step: 1

  # Kp
  - platform: template
    name: "Kp"
    id: _Kp
    optimistic: true
    restore_value: true
    mode: box
    min_value: 0
    max_value: 10
    step: 0.0001
    initial_value: 2.2
  # Ki
  - platform: template
    name: "Ki"
    id: _Ki
    optimistic: true
    restore_value: true
    mode: box
    min_value: 0
    max_value: 10
    step: 0.0001
    initial_value: 0.6
  # Kd
  - platform: template
    name: "Kd"
    id: _Kd
    optimistic: true
    restore_value: true
    mode: box
    min_value: 0
    max_value: 10
    step: 0.0001
    initial_value: 0.5

# Sonde Temperature Dallas
one_wire:
  - platform: gpio
    pin: GPIO2

# Protocole du JSK-MK 163T
uart:
  id: mod_bus
  tx_pin: 17
  rx_pin: 5
  baud_rate: 9600
modbus:
  id: modbus1
  uart_id: mod_bus
modbus_controller:
  - id: jsymk
    address: 0x1
    modbus_id: modbus1
    update_interval: 0.2s

sensor:
  - platform: modbus_controller
    modbus_controller_id: jsymk
    id: Tension
    address: 0x0048
    unit_of_measurement: "V"
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    filters:
      - multiply: 0.01
    register_count: 1
    response_size: 2

  - platform: modbus_controller
    modbus_controller_id: jsymk
    id: Courant
    address: 0x0049
    unit_of_measurement: "A"
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    register_count: 1
    response_size: 2

  - platform: modbus_controller
    modbus_controller_id: jsymk
    id: pureseau
    address: 0x004A
    unit_of_measurement: "W"
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    register_count: 1
    response_size: 2
    on_value:
      then:
        - lambda: |-
            if ( id(senspince).state == 1 ) {
              id(pureseau1).publish_state( id(pureseau).state *-1);
            } else {
              id(pureseau1).publish_state( id(pureseau).state );
            }
        - script.execute: calcul_injection

  - platform: modbus_controller
    modbus_controller_id: jsymk
    id: PuissanceConsommee
    name: PuissanceConsommee
    address: 0x004B
    unit_of_measurement: "kWh"
    register_type: holding
    value_type: U_DWORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.0003125
    register_count: 2
    response_size: 4
    state_class: "total_increasing"
    device_class: energy

  - platform: modbus_controller
    modbus_controller_id: jsymk
    id: FacteurDePuissance
    address: 0x004D
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.001
    register_count: 1
    response_size: 2

  - platform: modbus_controller
    modbus_controller_id: jsymk
    id: PuissanceInjectee
    name: PuissanceInjectee
    address: 0x004E
    unit_of_measurement: "kWh"
    register_type: holding
    value_type: U_DWORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.0003125
    register_count: 2
    response_size: 4
    state_class: "total_increasing"
    device_class: energy

  - platform: modbus_controller
    modbus_controller_id: jsymk
    id: senspince
    address: 0x0050
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    register_count: 1
    response_size: 2

  - platform: modbus_controller
    modbus_controller_id: jsymk
    id: Frequence
    address: 0x0051
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    register_count: 1
    response_size: 2

  - platform: dallas_temp
    name: "STriac Temperature"
    id: temp_triac
    update_interval: 2s
    on_value_range:
      - above: 65.0
        then:
          - switch.turn_on: ventillateur
      - below: 50.0
        then:
          - switch.turn_off: ventillateur

  ############### TEMPLATE  ######################"
  # Affichage dans HA et sur l'afficheur
  - platform: template
    name: "Pu Reseau"
    id: pureseau1
    unit_of_measurement: "W"
    state_class: "measurement"
    device_class: energy

  - platform: template
    name: "Sortie Triac"
    id: afstriac
    unit_of_measurement: "%"
    state_class: "measurement"
    accuracy_decimals: 2

switch:
  - platform: gpio
    name: "STriac Ventillateur"
    pin: GPIO4
    id: ventillateur

  - platform: template
    name: "Mode Auto"
    id: modeauto
    optimistic: true
    restore_mode: always_on

  - platform: restart
    name: "Restart"

output:
  - platform: ac_dimmer
    id: dimmer
    method: LEADING
    gate_pin: GPIO14
    zero_cross_pin:
      number: GPIO15
      mode:
        input: true
      inverted: yes

light:
  - platform: monochromatic
    id: gradateur
    output: dimmer
    gamma_correct: 1.0
    default_transition_length: 0s
    name: "STriac"

# ------------------------  Scripts
script:
  #
  # ------------------------ Calcul puissance injection
  - id: calcul_injection
    then:
      - if:
          condition:
            lambda: "return id(temp_triac).state < (id(tmax).state-2);"
          # Si Temp Triac inferieur au seuil-2° alors OK
          then:
            - binary_sensor.template.publish:
                id: temperatureok
                state: ON
      # Dévalidation du seuil de température
      - if:
          condition:
            lambda: "return id(temp_triac).state > id(tmax).state;"
          # Si Temp Triac supérieur ou égale au seuil alors NOK
          then:
            - binary_sensor.template.publish:
                id: temperatureok
                state: OFF
      # Validation du seuil de temperature triac

      - lambda: |-
          using namespace std;

          // --- CONFIG PID ---
          float Kp = id(_Kp).state;  // Coefficient proportionnel
          float Ki = id(_Ki).state;  // Coefficient intégral
          float Kd = id(_Kd).state;  // Coefficient dérivé
          static const float dt = 0.2;  // Intervalle entre mesures

          // --- FILTRES ---
          static float filtered_error = 0.0;
          static float filtered_derivative = 0.0;

          // --- ÉTATS PERSISTANTS ---
          static float previous_error = 0.0;
          static float integral = 0.0;
          static int count = 0;
          static const int interval = 5;  // 5 x 0.2s = 1s

          // --- MESURES ---
          float puissance_mesuree = id(pureseau1).state;
          float puissance_consigne = id(objective).state;

          // --- CALCUL ERREUR ---
          float raw_error = puissance_consigne - puissance_mesuree;
          filtered_error = 0.9f * filtered_error + 0.1f * raw_error;

          // --- DÉRIVÉE FILTRÉE ---
          float raw_derivative = (filtered_error - previous_error) / dt;
          filtered_derivative = 0.8f * filtered_derivative + 0.2f * raw_derivative;
          previous_error = filtered_error;

          count++;

          // --- MISE À JOUR PID ---
          if (count >= interval) {
            count = 0;

            // --- ANTI-WINDUP AVANT PID ---
            bool bloque_integrale = false;
            float tentative_output = Kp * filtered_error + Ki * integral + Kd * filtered_derivative;
            float tentative_norm = tentative_output / 3000.0;

            if ((tentative_norm >= 1.0 && filtered_error > 0) || (tentative_norm <= 0.0 && filtered_error < 0)) {
              bloque_integrale = true;
            }

            if (!bloque_integrale) {
              integral += filtered_error * dt;
              if (integral > 2000) integral = 2000;
              if (integral < -2000) integral = -2000;
            }

            // --- PID FINAL ---
            float output = Kp * filtered_error + Ki * integral + Kd * filtered_derivative;
            float output_norm = output / 3000.0;
            if (output_norm > 1.0) output_norm = 1.0;
            if (output_norm < 0.0) output_norm = 0.0;

            // Application au triac
            id(striac) = output;

            ESP_LOGI("PID", "Pmes: %.1f W | Pcons: %.1f W | err: %.1f | out: %.3f", puissance_mesuree, puissance_consigne, filtered_error, output);
          }

      # Si Routeur Validé et mode auto et temperature ok alors on active le triac
      - if:
          condition:
            and:
              - switch.is_on: modeauto
              - binary_sensor.is_on: temperatureok
          then:
            - light.turn_on:
                id: gradateur
                brightness: !lambda |-
                  return id(striac) ;

      # Si mode routeur devalidé ou temp NOK alors on désactive le triac
      - if:
          condition:
            and:
              - switch.is_on: modeauto
              - binary_sensor.is_off: temperatureok

          then:
            - lambda: |-
                id(striac) = 0;
            - light.turn_off: gradateur
            - logger.log:
                format: "Log Auto NOk STriac %f - Temperature ALERT %.2f °C"
                args: ["id(striac)", id(temp_triac).state]
                level: "info"

      - if:
          condition:
            and:
              - switch.is_off: modeauto
              - binary_sensor.is_off: temperatureok
          then:
            - light.turn_off: gradateur
            - logger.log:
                format: "Temperature ALERT %.2f °C"
                args: ["id(temp_triac).state"]
                level: "info"

      # Affichage STriac et Increment
      - lambda: |-
          id(afstriac).publish_state( id(striac) * 100);
